<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Castorly: la cinta dibuja una «C» y termina en la cola de Cástor. -->
  <defs>
    <linearGradient id="cly-c" x1="80" y1="70" x2="420" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9B3DFF"/>
      <stop offset=".38" stop-color="#2160F0"/>
      <stop offset="1" stop-color="#6FE3FF"/>
    </linearGradient>
    <linearGradient id="cly-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1A4A" stop-opacity="0"/>
      <stop offset="1" stop-color="#0D1A4A" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="cly-tail" x1="250" y1="340" x2="470" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2160F0"/>
      <stop offset="1" stop-color="#6FE3FF"/>
    </linearGradient>
    <clipPath id="cly-tail-clip"><ellipse cx="0" cy="0" rx="112" ry="62"/></clipPath>
  </defs>
  <!-- Sombra suave de la cinta -->
  <path d="M392 136 C330 70 196 62 128 140 C64 214 82 352 196 414" fill="none" stroke="#0D1A4A" stroke-opacity=".18" stroke-width="96" stroke-linecap="round" transform="translate(6 10)"/>
  <!-- La cinta en C -->
  <path d="M392 136 C330 70 196 62 128 140 C64 214 82 352 196 414" fill="none" stroke="url(#cly-c)" stroke-width="96" stroke-linecap="round"/>
  <path d="M392 136 C330 70 196 62 128 140 C64 214 82 352 196 414" fill="none" stroke="url(#cly-shade)" stroke-width="96" stroke-linecap="round"/>
  <!-- Brillo de la cinta -->
  <path d="M370 118 C318 76 222 74 166 118" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="16" stroke-linecap="round"/>
  <path d="M110 214 C100 260 108 304 132 338" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="12" stroke-linecap="round"/>
  <!-- La cola de Cástor, con su textura en rombos -->
  <g transform="translate(330 400) rotate(-22)">
    <ellipse cx="4" cy="10" rx="112" ry="62" fill="#0D1A4A" fill-opacity=".18"/>
    <ellipse cx="0" cy="0" rx="112" ry="62" fill="url(#cly-tail)"/>
    <g clip-path="url(#cly-tail-clip)" stroke="#fff" stroke-opacity=".42" stroke-width="5">
      <path d="M-150 -60 L30 120 M-110 -60 L70 120 M-70 -60 L110 120 M-30 -60 L150 120 M10 -60 L190 120 M-190 -60 L-10 120"/>
      <path d="M150 -60 L-30 120 M110 -60 L-70 120 M70 -60 L-110 120 M30 -60 L-150 120 M-10 -60 L-190 120 M190 -60 L10 120"/>
    </g>
    <ellipse cx="-34" cy="-26" rx="52" ry="14" fill="#fff" fill-opacity=".28" transform="rotate(-8)"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
