services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/data/nexobyte.db"
      AUTH_SECRET: "${AUTH_SECRET:?Define AUTH_SECRET en el archivo .env}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@nexobyte.co}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en el archivo .env}"
    volumes:
      - nexobyte-data:/data
    restart: unless-stopped

volumes:
  nexobyte-data:
